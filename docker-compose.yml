version: '3.8'

services:
  # 1. Reverse Proxy & API Gateway
  gateway:
    image: nginx:alpine
    container_name: hp_agri_gateway
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - hp_agri_net

  # 2. Frappe REST Backend & Application Engine
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hp_agri_backend
    environment:
      - PORT=5000
      - DATABASE_URL=postgresql://agri_user:agri_secure_pass@postgres:5432/hp_agri_db
      - REDIS_URL=redis://redis:6379
      - S3_ENDPOINT=http://minio:9000
      - ML_SERVICE_URL=http://ml_service:8000
    ports:
      - "5000:5000"
    depends_on:
      - postgres
      - redis
    networks:
      - hp_agri_net

  # 3. React.js Web Client UI
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hp_agri_frontend
    ports:
      - "5173:5173"
    networks:
      - hp_agri_net

  # 4. PostgreSQL Relational Data Backbone
  postgres:
    image: postgres:16-alpine
    container_name: hp_agri_postgres
    environment:
      POSTGRES_USER: agri_user
      POSTGRES_PASSWORD: agri_secure_pass
      POSTGRES_DB: hp_agri_db
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - hp_agri_net

  # 5, 6, 7. Redis Cache, Rate Limiting & Background Queues
  redis:
    image: redis:7-alpine
    container_name: hp_agri_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - hp_agri_net

  # 8. Python AI/ML Microservice (Satellite NDVI & Pest Predictions)
  ml_service:
    build:
      context: ./ml_service
      dockerfile: Dockerfile
    container_name: hp_agri_ml_service
    ports:
      - "8000:8000"
    networks:
      - hp_agri_net

  # 9. S3-Compatible Object Storage (MinIO)
  minio:
    image: minio/minio:latest
    container_name: hp_agri_s3_storage
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio_agri_admin
      MINIO_ROOT_PASSWORD: minio_agri_secure_pass
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - hp_agri_net

  # 10. Monitoring & Observability (Prometheus)
  prometheus:
    image: prom/prometheus:latest
    container_name: hp_agri_prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - hp_agri_net

networks:
  hp_agri_net:
    driver: bridge

volumes:
  pg_data:
  redis_data:
  minio_data:
