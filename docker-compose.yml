version: '3.8'

services:
  # 1. API Gateway / Reverse Proxy & Rate Limiter
  gateway:
    image: nginx:alpine
    container_name: hp_agri_gateway
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - hp_agri_net

  # 2. FRAPPE REST Backend & Application Services
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hp_agri_backend
    environment:
      - PORT=5000
      - DATABASE_URL=postgresql://agri_user:agri_secure_pass@postgres:5432/hp_agri_db
      - REDIS_URL=redis://redis:6379
    ports:
      - "5000:5000"
    depends_on:
      - postgres
      - redis
    networks:
      - hp_agri_net

  # 3. React.js Web / Mobile Client UI
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hp_agri_frontend
    ports:
      - "5173:5173"
    networks:
      - hp_agri_net

  # 4. PostgreSQL Relational Data Backbone (Cadastral Land & Farmer Registry)
  postgres:
    image: postgres:16-alpine
    container_name: hp_agri_postgres
    environment:
      POSTGRES_USER: agri_user
      POSTGRES_PASSWORD: agri_secure_pass
      POSTGRES_DB: hp_agri_db
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - hp_agri_net

  # 5. Redis High-Performance Cache & Asynchronous Queues
  redis:
    image: redis:7-alpine
    container_name: hp_agri_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - hp_agri_net

networks:
  hp_agri_net:
    driver: bridge

volumes:
  pg_data:
  redis_data:
