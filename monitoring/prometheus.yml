global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'hp_agri_gateway'
    static_configs:
      - targets: ['backend:5000']
    metrics_path: '/metrics'

  - job_name: 'hp_agri_ai_ml'
    static_configs:
      - targets: ['ml_service:8000']
    metrics_path: '/metrics'
